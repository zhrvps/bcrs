<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>瓶子</title>

  <!-- Icon for the browser tab and the phone home screen -->
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="瓶子">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #ffffff;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
    }
    .qr {
      display: block;
      /* About half the screen width, never taller than half the screen */
      width: min(50vw, 50vh, 360px);
      height: auto;
      image-rendering: pixelated;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <img class="qr" src="qr.png" alt="QR code">
</body>
</html>
