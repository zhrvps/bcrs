<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>瓶子</title>

  <!-- Icon for the browser tab and the phone home screen -->
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="瓶子">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #ffffff;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
    }
    #qr {
      /* About half the screen width, never taller than half the screen */
      width: min(50vw, 50vh, 360px);
      aspect-ratio: 1 / 1;
    }
    #qr svg {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="qr" role="img" aria-label="QR code"></div>

  <script src="qrcode.js"></script>
  <script>
    // The payment link that the QR code holds. Change this line to use a new link.
    var PAY_LINK = "https://www.dbs.com.sg/personal/mobile/paylink/index.html?tranRef=CJ4GsCGAYU";

    var qr = qrcode(0, "M");   // 0 = pick the size automatically, M = medium error correction
    qr.addData(PAY_LINK);
    qr.make();

    // Draw the QR code as SVG, so that it stays sharp at any size.
    var count = qr.getModuleCount();
    var quiet = 4;             // white border around the code, in modules
    var size = count + quiet * 2;
    var path = "";
    for (var r = 0; r < count; r++) {
      for (var c = 0; c < count; c++) {
        if (qr.isDark(r, c)) {
          path += "M" + (c + quiet) + "," + (r + quiet) + "h1v1h-1z";
        }
      }
    }
    document.getElementById("qr").innerHTML =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + " " + size +
      '" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/>' +
      '<path fill="#000" d="' + path + '"/></svg>';
  </script>
</body>
</html>
