<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>瓶子</title>

  <!-- Icon for the browser tab and the phone home screen -->
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="瓶子">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#e3f1e4">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #e3f1e4;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 5vmin;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
    }
    .card img {
      display: block;
      /* Large on a phone, but never bigger than the screen */
      width: min(80vw, 70vh, 480px);
      height: auto;
      image-rendering: pixelated;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="qr.png" alt="QR code">
  </div>
</body>
</html>
